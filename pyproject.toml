[project]
name = "kravu"
version = "0.1.0"
description = "A local-first, open-source job-hunting pipeline."
authors = [{ name = "Muhammad Huzaifa Ali" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-jobspy>=1.1.82,<2",
    "litellm>=1.99,<2",
    "typer>=0.27,<1",
    "rich>=15,<16",
    "playwright>=1.62,<2",
    "selectolax>=0.4.11,<1",
    "trafilatura>=2.2,<3",
    "pyyaml>=6.0.3,<7",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<1", "mypy>=2.3,<3", "types-PyYAML>=6,<7"]

[project.scripts]
kravu = "kravu.entrypoints.cli:app"

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kravu"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/kravu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
